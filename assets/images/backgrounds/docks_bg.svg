<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070c"/>
      <stop offset="0.58" stop-color="#0b141c"/>
      <stop offset="1" stop-color="#16242b"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17333b"/>
      <stop offset="1" stop-color="#071217"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3028"/>
      <stop offset="1" stop-color="#171615"/>
    </linearGradient>
    <linearGradient id="lamp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a3" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#a35a25" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d7eef1" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#8bb4ba" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.45" numOctaves="3" seed="9"/><feColorMatrix values="0 0 0 0 0.6 0 0 0 0 0.72 0 0 0 0 0.75 0 0 0 .08 0"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="1540" cy="185" r="145" fill="url(#moon)"/>
  <circle cx="1540" cy="185" r="44" fill="#d8e6e5" opacity="0.42"/>

  <!-- distant Innsmouth skyline -->
  <g fill="#070b10" opacity="0.96">
    <path d="M0 565 L0 365 L105 304 L198 377 L198 565 Z"/>
    <path d="M180 565 L180 410 L280 336 L405 424 L405 565 Z"/>
    <path d="M385 565 L385 350 L472 287 L535 335 L535 565 Z"/>
    <path d="M520 565 L520 420 L640 350 L760 430 L760 565 Z"/>
    <path d="M735 565 L735 320 L820 255 L905 326 L905 565 Z"/>
  </g>
  <g fill="#9ab5a2" opacity="0.18">
    <rect x="86" y="391" width="20" height="28"/><rect x="139" y="401" width="18" height="24"/>
    <rect x="440" y="363" width="16" height="25"/><rect x="481" y="382" width="18" height="24"/>
    <rect x="798" y="346" width="17" height="25"/><rect x="846" y="362" width="17" height="25"/>
  </g>

  <!-- boathouse -->
  <g>
    <path d="M1130 255 L1450 255 L1538 340 L1538 760 L1035 760 L1035 340 Z" fill="#111719" stroke="#050707" stroke-width="12"/>
    <path d="M1015 340 L1286 164 L1562 340 Z" fill="#161819" stroke="#050707" stroke-width="14"/>
    <path d="M1076 383 H1230 V760 H1076 Z" fill="#20211f" stroke="#090a09" stroke-width="8"/>
    <path d="M1295 352 H1490 V760 H1295 Z" fill="#0c1011" stroke="#050707" stroke-width="8"/>
    <path d="M1332 395 H1456 V690 H1332 Z" fill="#171918" stroke="#514633" stroke-width="7"/>
    <circle cx="1442" cy="544" r="8" fill="#c5a263"/>
    <rect x="1160" y="305" width="230" height="52" rx="4" fill="#080a0a" stroke="#423a2d" stroke-width="4"/>
    <text x="1275" y="340" text-anchor="middle" font-family="serif" font-size="25" letter-spacing="4" fill="#8f846d">COAST GUARD</text>
    <path d="M1110 560 H1202 M1110 590 H1202 M1110 620 H1202" stroke="#655844" stroke-width="5" opacity="0.45"/>
  </g>

  <!-- sea -->
  <rect x="0" y="560" width="1920" height="520" fill="url(#sea)"/>
  <g fill="none" stroke="#6ea0a4" opacity="0.14">
    <path d="M0 680 C190 650 335 718 520 684 S830 653 1010 690 S1370 720 1535 685 S1760 650 1920 688" stroke-width="5"/>
    <path d="M0 760 C160 730 328 792 510 760 S870 726 1050 772 S1410 800 1600 760 S1790 748 1920 775" stroke-width="3"/>
    <path d="M0 860 C180 824 350 884 555 850 S895 824 1100 867 S1470 887 1680 851 S1840 844 1920 859" stroke-width="2"/>
  </g>

  <!-- pier -->
  <path d="M0 745 L1920 706 L1920 1080 L0 1080 Z" fill="url(#wood)" stroke="#090909" stroke-width="10"/>
  <g stroke="#0a0a0a" stroke-width="5" opacity="0.7">
    <path d="M0 795 L1920 758"/><path d="M0 866 L1920 830"/><path d="M0 943 L1920 907"/><path d="M0 1022 L1920 985"/>
    <path d="M175 742 L145 1080"/><path d="M470 735 L450 1080"/><path d="M790 730 L785 1080"/><path d="M1110 722 L1120 1080"/><path d="M1450 716 L1480 1080"/><path d="M1770 710 L1810 1080"/>
  </g>

  <!-- posts and ropes -->
  <g fill="#10100f" stroke="#070707" stroke-width="5">
    <rect x="240" y="635" width="42" height="265" rx="6"/><rect x="860" y="610" width="45" height="275" rx="6"/><rect x="1640" y="575" width="48" height="285" rx="6"/>
  </g>
  <g fill="none" stroke="#51483c" stroke-width="10" opacity="0.72">
    <path d="M280 678 C470 735 680 668 862 657"/><path d="M902 651 C1110 710 1400 611 1642 625"/>
  </g>

  <!-- dock lamp -->
  <g transform="translate(720 350)">
    <rect x="-10" y="78" width="20" height="320" fill="#080909"/>
    <path d="M-16 90 C-78 78 -85 40 -85 5 H-68 C-66 34 -44 54 -10 57" fill="none" stroke="#080909" stroke-width="14"/>
    <rect x="-112" y="-30" width="56" height="70" rx="4" fill="#111312" stroke="#050505" stroke-width="7"/>
    <rect x="-101" y="-18" width="34" height="45" fill="#f5d78a" opacity="0.75"/>
    <path d="M-84 6 L-360 470 L225 455 Z" fill="url(#lamp)" opacity="0.23"/>
  </g>

  <!-- abandoned boat -->
  <g transform="translate(1500 665) rotate(-2)">
    <path d="M-155 0 Q0 76 155 0 L118 72 Q0 112 -118 72 Z" fill="#141b1c" stroke="#060808" stroke-width="7"/>
    <path d="M-102 25 H98" stroke="#6a6459" stroke-width="7"/>
    <text x="3" y="59" text-anchor="middle" font-family="serif" font-size="28" fill="#9e9b8c" opacity="0.8">317</text>
  </g>

  <!-- foreground fog -->
  <g fill="#a9c1c2" opacity="0.075" filter="url(#soft)">
    <ellipse cx="420" cy="636" rx="500" ry="86"/>
    <ellipse cx="1370" cy="594" rx="610" ry="92"/>
    <ellipse cx="965" cy="718" rx="720" ry="75"/>
  </g>
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.35"/>
</svg>
