<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111416"/>
      <stop offset="0.6" stop-color="#1a1d1c"/>
      <stop offset="1" stop-color="#0b0d0d"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#332d27"/>
      <stop offset="1" stop-color="#151413"/>
    </linearGradient>
    <radialGradient id="windowGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#8db8bf" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#24444a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d4d3d"/>
      <stop offset="1" stop-color="#231c17"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="3" seed="17"/><feColorMatrix values="0 0 0 0 0.6 0 0 0 0 0.65 0 0 0 0 0.62 0 0 0 .07 0"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#wall)"/>

  <!-- wall framing -->
  <g stroke="#070909" stroke-width="18" opacity="0.9">
    <path d="M80 0 V790 M380 0 V790 M690 0 V790 M1010 0 V790 M1335 0 V790 M1650 0 V790"/>
    <path d="M0 180 H1920 M0 520 H1920"/>
  </g>
  <g stroke="#373833" stroke-width="3" opacity="0.26">
    <path d="M92 0 V790 M392 0 V790 M702 0 V790 M1022 0 V790 M1347 0 V790 M1662 0 V790"/>
  </g>

  <!-- left door -->
  <g>
    <rect x="88" y="270" width="250" height="520" fill="#181817" stroke="#080808" stroke-width="12"/>
    <rect x="112" y="300" width="202" height="458" fill="#25231f" stroke="#4c4437" stroke-width="5"/>
    <path d="M135 330 L290 725 M290 330 L135 725" stroke="#383229" stroke-width="7" opacity="0.7"/>
    <circle cx="286" cy="540" r="10" fill="#a4854b"/>
  </g>

  <!-- grimy windows -->
  <g>
    <rect x="430" y="135" width="360" height="300" fill="#0b181c" stroke="#050606" stroke-width="14"/>
    <rect x="454" y="159" width="312" height="252" fill="#294d54" opacity="0.25"/>
    <path d="M610 159 V411 M454 285 H766" stroke="#090c0d" stroke-width="12"/>
    <ellipse cx="610" cy="285" rx="260" ry="210" fill="url(#windowGlow)" filter="url(#blur)"/>
    <path d="M470 188 L720 385 M520 167 L760 350" stroke="#b7d0d1" stroke-width="2" opacity="0.18"/>
  </g>

  <!-- service lockers -->
  <g transform="translate(900 215)">
    <rect width="430" height="570" rx="6" fill="#181b1b" stroke="#070808" stroke-width="10"/>
    <g fill="#252827" stroke="#3d403b" stroke-width="3">
      <rect x="18" y="20" width="126" height="530"/><rect x="152" y="20" width="126" height="530"/><rect x="286" y="20" width="126" height="530"/>
    </g>
    <g fill="#0d0f0f" stroke="#4d514b" stroke-width="3">
      <rect x="38" y="54" width="86" height="30"/><rect x="172" y="54" width="86" height="30"/><rect x="306" y="54" width="86" height="30"/>
    </g>
    <g font-family="serif" font-size="28" fill="#a79c80" text-anchor="middle">
      <text x="81" y="80">315</text><text x="215" y="80">316</text><text x="349" y="80">317</text>
    </g>
    <g stroke="#0b0d0d" stroke-width="5">
      <path d="M58 120 H105 M58 140 H105 M58 160 H105"/>
      <path d="M192 120 H239 M192 140 H239 M192 160 H239"/>
      <path d="M326 120 H373 M326 140 H373 M326 160 H373"/>
    </g>
    <circle cx="376" cy="300" r="9" fill="#b99852"/>
  </g>

  <!-- radio desk -->
  <g transform="translate(1395 470)">
    <rect x="-40" y="180" width="430" height="38" fill="#201b18" stroke="#090807" stroke-width="7"/>
    <rect x="0" y="20" width="286" height="170" rx="8" fill="#181a19" stroke="#070807" stroke-width="8"/>
    <rect x="26" y="46" width="112" height="76" fill="#53635d" opacity="0.42" stroke="#080909" stroke-width="5"/>
    <path d="M48 90 H118" stroke="#b0d7c0" stroke-width="3" opacity="0.55"/>
    <circle cx="190" cy="74" r="22" fill="#242522" stroke="#6d6048" stroke-width="5"/>
    <circle cx="242" cy="74" r="17" fill="#242522" stroke="#6d6048" stroke-width="4"/>
    <path d="M56 150 H240" stroke="#4a4a44" stroke-width="8" stroke-dasharray="8 8"/>
    <path d="M275 30 C330 -20 360 -95 340 -150" fill="none" stroke="#151616" stroke-width="7"/>
  </g>

  <!-- fuse box -->
  <g transform="translate(660 560)">
    <rect width="180" height="190" rx="6" fill="url(#rust)" stroke="#090807" stroke-width="8"/>
    <rect x="26" y="32" width="128" height="86" fill="#101312" stroke="#5b5242" stroke-width="4"/>
    <circle cx="62" cy="76" r="18" fill="#1d211f" stroke="#88724c" stroke-width="4"/>
    <circle cx="118" cy="76" r="18" fill="#1d211f" stroke="#88724c" stroke-width="4"/>
    <path d="M54 143 H127" stroke="#b26b3b" stroke-width="6"/>
    <text x="90" y="174" text-anchor="middle" font-family="serif" font-size="18" fill="#b0a387">PESCANTE</text>
  </g>

  <!-- suspended boat / davit -->
  <g transform="translate(1320 735)">
    <path d="M-210 35 Q0 128 235 28 L190 108 Q0 167 -185 108 Z" fill="#172022" stroke="#070909" stroke-width="9"/>
    <path d="M-160 67 H180" stroke="#6d6b60" stroke-width="8"/>
    <text x="14" y="112" text-anchor="middle" font-family="serif" font-size="34" fill="#a8a28e">317</text>
    <path d="M-165 -370 V25 M184 -370 V22" stroke="#0a0b0b" stroke-width="11"/>
    <path d="M-200 -370 H220" stroke="#0a0b0b" stroke-width="18"/>
    <circle cx="-165" cy="-355" r="34" fill="#151616" stroke="#5a4c39" stroke-width="7"/>
    <circle cx="184" cy="-355" r="34" fill="#151616" stroke="#5a4c39" stroke-width="7"/>
  </g>

  <!-- floor -->
  <path d="M0 790 L1920 760 L1920 1080 L0 1080 Z" fill="url(#floor)" stroke="#090909" stroke-width="9"/>
  <g stroke="#090909" stroke-width="5" opacity="0.7">
    <path d="M0 845 L1920 817"/><path d="M0 920 L1920 893"/><path d="M0 1000 L1920 972"/>
    <path d="M280 785 L245 1080"/><path d="M650 779 L640 1080"/><path d="M1040 773 L1060 1080"/><path d="M1450 767 L1490 1080"/><path d="M1760 762 L1810 1080"/>
  </g>

  <!-- drain / wet marks -->
  <ellipse cx="520" cy="905" rx="170" ry="48" fill="#0a1516" opacity="0.7"/>
  <g stroke="#557777" stroke-width="4" opacity="0.19">
    <path d="M420 897 C500 880 575 920 650 902"/><path d="M455 916 C532 895 584 937 626 920"/>
  </g>

  <!-- hanging bulb, initially mostly dead -->
  <g transform="translate(1050 0)">
    <path d="M0 0 V190" stroke="#080909" stroke-width="7"/>
    <circle cx="0" cy="215" r="25" fill="#c8b47d" opacity="0.16"/>
    <ellipse cx="0" cy="225" rx="230" ry="185" fill="#d5bd7b" opacity="0.035" filter="url(#blur)"/>
  </g>

  <!-- grime / film texture -->
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.42"/>
</svg>
