    <g transform="translate(800 128)"><circle cx="55" cy="55" r="53" fill="#101315" stroke="#54452f" stroke-width="7"/><circle cx="55" cy="55" r="40" fill="#ddd2b7" opacity=".78"/><path d="M55 55V25M55 55l24 13" stroke="#252019" stroke-width="5" stroke-linecap="round"/></g>

