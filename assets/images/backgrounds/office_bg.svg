    <g transform="translate(850 245)">
      <rect width="310" height="495" fill="#100b08" stroke="#080605" stroke-width="12"/>
      <rect x="18" y="18" width="274" height="455" fill="url(#wood)"/>
      <path d="M18 128H292M18 236H292M18 344H292" stroke="#0a0705" stroke-width="13"/>
      <g stroke="#090706" stroke-width="2">
        <path d="M35 49h22v68H35z" fill="#473726"/><path d="M59 38h17v79H59z" fill="#6d3a2c"/><path d="M79 53h24v64H79z" fill="#34434b"/><path d="M106 42h18v75h-18z" fill="#4c4829"/><path d="M132 58h28v59h-28z" fill="#2c3a31"/><path d="M168 36h21v81h-21z" fill="#583025"/><path d="M196 48h24v69h-24z" fill="#33414a"/><path d="M227 31h19v86h-19z" fill="#635234"/><path d="M250 55h27v62h-27z" fill="#373124"/>
        <path d="M35 157h19v68H35z" fill="#354733"/><path d="M58 145h25v80H58z" fill="#55312b"/><path d="M88 166h19v59H88z" fill="#665331"/><path d="M112 151h30v74h-30z" fill="#303b42"/><path d="M148 141h17v84h-17z" fill="#58372b"/><path d="M171 160h24v65h-24z" fill="#2f443c"/><path d="M202 148h21v77h-21z" fill="#5b5131"/><path d="M231 155h43v70h-43z" fill="#3c2d2a"/>
      </g>
      <path d="M176 384h72v51h-72z" fill="#271d18" stroke="#88714d" stroke-width="3"/><path d="M190 396h43" stroke="#a5926b" stroke-width="3"/><circle cx="249" cy="376" r="46" fill="#765b26" opacity=".08"/>
    </g>

    <!-- Inspector desk, case papers and lamp -->
    <g transform="translate(410 560)">
      <path d="M0 85H410L372 280H38Z" fill="url(#wood)" stroke="#0b0705" stroke-width="12"/>
      <rect x="-18" y="58" width="445" height="49" rx="5" fill="#412817" stroke="#0a0705" stroke-width="9"/>
      <path d="M37 108h115v112H37zM258 108h112v112H258z" fill="#281810" stroke="#0c0806" stroke-width="6"/>
      <circle cx="133" cy="166" r="6" fill="#a67c40"/><circle cx="276" cy="166" r="6" fill="#a67c40"/>
      <g transform="translate(73 7) rotate(-4)"><rect width="122" height="75" fill="#c8b994"/><path d="M12 16h87M12 28h74M12 40h94M12 52h58" stroke="#5e5747" stroke-width="3"/></g>
      <g transform="translate(208 16) rotate(6)"><rect width="97" height="61" fill="#a89a7b"/><circle cx="69" cy="40" r="12" fill="none" stroke="#70352d" stroke-width="4"/></g>
      <g transform="translate(329 -65)"><path d="M25 75V8" stroke="#3d2c20" stroke-width="10"/><path d="M-18 9H68L48-38H3Z" fill="#7f5a2d" stroke="#1a120c" stroke-width="7"/><circle cx="25" cy="2" r="67" fill="url(#lamp)" opacity=".85"/></g>
    </g>

    <!-- Filing cabinet / puzzle drawer -->
    <g transform="translate(1240 530)">
      <rect width="185" height="245" fill="#252a2a" stroke="#090b0b" stroke-width="9"/>
      <path d="M12 16h161v62H12zM12 91h161v62H12zM12 166h161v62H12z" fill="#353b39" stroke="#111615" stroke-width="4"/>
      <path d="M72 44h42M72 119h42M72 194h42" stroke="#a38b62" stroke-width="6"/><rect x="16" y="165" width="153" height="63" fill="#443526" opacity=".45"/>
