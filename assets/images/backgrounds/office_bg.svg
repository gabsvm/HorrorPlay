    <ellipse cx="270" cy="670" rx="360" ry="430" fill="#77b3cf" opacity=".06" filter="url(#blur)"/>

    <!-- Case wall and clock -->
    <g transform="translate(420 112)">
      <rect width="330" height="250" rx="4" fill="#17120e" stroke="#070605" stroke-width="12"/>
      <rect x="19" y="18" width="292" height="214" fill="#6c5a43" opacity=".55"/>
      <g stroke="#2c2218" stroke-width="3" fill="#d1c5aa">
        <path d="M38 46h105v72H38z"/><path d="M176 38h111v91H176z"/><path d="M72 143h91v62H72z"/><path d="M196 151h79v52H196z"/>
      </g>
      <path d="M89 78L227 80L117 174L236 177" stroke="#7e2f2a" stroke-width="4" fill="none" opacity=".7"/>
      <circle cx="88" cy="78" r="6" fill="#a74437"/><circle cx="227" cy="80" r="6" fill="#a74437"/><circle cx="117" cy="174" r="6" fill="#a74437"/>
