    <!-- Carpet and foreground shadow -->
    <path d="M370 796L1450 796L1660 1055L160 1055Z" fill="#3f2925" opacity=".5" stroke="#17100f" stroke-width="8"/>
    <path d="M420 824L1405 824L1528 1015L288 1015Z" fill="none" stroke="#715548" stroke-width="4" opacity=".38"/>
    <rect y="1032" width="1920" height="48" fill="#040506" opacity=".55"/>
  </g>
