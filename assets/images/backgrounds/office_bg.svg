    <!-- Exit door -->
    <g transform="translate(1610 290)">
      <rect width="235" height="490" fill="#100d0b" stroke="#070605" stroke-width="15"/>
      <rect x="22" y="20" width="191" height="450" fill="url(#wood)"/>
      <path d="M42 45h150v168H42zM42 238h150v190H42z" fill="none" stroke="#17100b" stroke-width="9"/>
      <circle cx="178" cy="276" r="10" fill="#9a7943"/><path d="M195 0l40-33" stroke="#060504" stroke-width="10"/>
