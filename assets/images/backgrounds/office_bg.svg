    <path d="M115 710L0 1080 M440 710L335 1080 M785 710L750 1080 M1120 710L1180 1080 M1480 710L1620 1080 M1770 710L1920 1000" stroke="#090c0e" stroke-width="3" opacity=".58"/>

    <!-- Rain-streaked arched window -->
    <g transform="translate(90 95)">
      <path d="M0 490V155Q0 0 145 0Q290 0 290 155V490Z" fill="url(#rainWindow)" stroke="#090c0f" stroke-width="18"/>
      <circle cx="208" cy="92" r="60" fill="url(#moon)"/>
      <path d="M145 12V490M10 235H280" stroke="#11181d" stroke-width="13"/>
      <path d="M35 58l-25 94M82 24L51 166M125 72l-29 112M178 32l-29 126M228 66l-31 122M264 114l-24 102M58 262l-28 110M119 246l-33 142M198 267l-31 132M257 240l-27 119" stroke="#b7dbe8" stroke-width="3" opacity=".32"/>
