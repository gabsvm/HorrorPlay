      <g stroke="#0a0705" stroke-width="3">
        <path d="M47 61h26v60H47z" fill="#5d3525"/><path d="M83 47h22v74H83z" fill="#375342"/><path d="M117 66h30v55h-30z" fill="#665229"/><path d="M160 42h22v79h-22z" fill="#503128"/><path d="M196 56h29v65h-29z" fill="#2d4c4b"/><path d="M242 39h24v82h-24z" fill="#744128"/><path d="M282 63h32v58h-32z" fill="#4b3b25"/><path d="M329 48h26v73h-26z" fill="#315038"/><path d="M371 58h28v63h-28z" fill="#68402b"/><path d="M416 41h24v80h-24z" fill="#3e4e58"/><path d="M454 69h27v52h-27z" fill="#644129"/>
        <path d="M43 183h31v63H43z" fill="#4d4b2e"/><path d="M85 167h24v79H85z" fill="#6b3427"/><path d="M122 191h30v55h-30z" fill="#29453b"/><path d="M166 174h25v72h-25z" fill="#4a3a29"/><path d="M210 181h35v65h-35z" fill="#6b4c28"/><path d="M259 163h22v83h-22z" fill="#375057"/><path d="M297 183h28v63h-28z" fill="#62392b"/><path d="M340 173h31v73h-31z" fill="#334c36"/><path d="M386 188h30v58h-30z" fill="#65532d"/><path d="M431 169h24v77h-24z" fill="#53302a"/>
      </g>
      <ellipse cx="264" cy="329" rx="58" ry="41" fill="#172322" stroke="#8d7247" stroke-width="6"/><path d="M224 330c24-29 56-28 83-2c-26 23-58 24-83 2z" fill="#567765" opacity=".7"/><circle cx="282" cy="324" r="4" fill="#d5c88b"/>
