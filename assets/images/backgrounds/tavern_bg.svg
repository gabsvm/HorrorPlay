      <rect x="-18" y="62" width="820" height="55" rx="5" fill="#4e2c18" stroke="#090604" stroke-width="10"/>
      <path d="M76 127v139M225 127v139M374 127v139M523 127v139M672 127v139" stroke="#1a100b" stroke-width="7" opacity=".65"/>
      <g transform="translate(94 23)"><ellipse cx="0" cy="25" rx="34" ry="10" fill="#191410"/><path d="M-26 22v32q26 16 52 0V22" fill="#45413a"/><path d="M30 25q28 10 4 28" fill="none" stroke="#45413a" stroke-width="7"/></g>
      <g transform="translate(594 15) rotate(5)"><rect width="115" height="67" fill="#9d8e70"/><path d="M12 17h83M12 30h66M12 44h88" stroke="#4b4335" stroke-width="4"/></g>
    </g>

    <!-- fireplace right -->
    <g transform="translate(1505 325)">
      <rect width="330" height="425" fill="#211916" stroke="#0a0705" stroke-width="12"/>
      <path d="M55 425V240Q55 135 165 135Q275 135 275 240V425Z" fill="#090605" stroke="#16100d" stroke-width="9"/>
      <rect x="-25" y="-12" width="380" height="35" fill="#321f15" stroke="#0a0705" stroke-width="9"/>
      <ellipse cx="165" cy="365" rx="210" ry="190" fill="url(#fire)" opacity=".55" filter="url(#soft)"/>
      <path d="M110 403q22-94 58-8q29-126 63 8q-45 38-121 0z" fill="#e57a2c"/><path d="M137 402q20-62 35-10q19-81 34 10q-29 21-69 0z" fill="#ffd36e"/>
      <path d="M82 420H250" stroke="#201813" stroke-width="13" stroke-linecap="round"/>
    </g>

    <!-- patrons / booths -->
    <g opacity=".82">
      <path d="M342 607q0-55 40-55q42 0 42 55v101h-82z" fill="#12100e"/><circle cx="383" cy="530" r="31" fill="#161310"/>
      <path d="M470 634q0-60 44-60q43 0 43 60v91h-87z" fill="#11100e"/><circle cx="514" cy="548" r="30" fill="#181511"/>
      <path d="M574 604q0-48 36-48q39 0 39 48v112h-75z" fill="#12100f"/><circle cx="611" cy="535" r="27" fill="#171411"/>
      <rect x="330" y="690" width="340" height="35" fill="#27180f" stroke="#0c0805" stroke-width="7"/>
    </g>

    <!-- back notice board / missing men -->
    <g transform="translate(380 205)">
      <rect width="280" height="230" fill="#201610" stroke="#090604" stroke-width="10"/><rect x="18" y="18" width="244" height="194" fill="#6f5b43" opacity=".62"/>
      <path d="M36 39h82v105H36zM141 47h99v72h-99zM133 137h105v54h-105z" fill="#c3b694" stroke="#3d3429" stroke-width="3"/>
