    <!-- hanging lantern pools -->
    <g><path d="M610 0v160M1440 0v170" stroke="#0a0705" stroke-width="9"/><path d="M565 158h90l-13 74h-64zM1396 168h88l-12 72h-64z" fill="#2b2015" stroke="#0b0805" stroke-width="8"/><circle cx="610" cy="196" r="13" fill="#e7b75b"/><circle cx="1440" cy="205" r="13" fill="#e7b75b"/><ellipse cx="610" cy="300" rx="260" ry="300" fill="url(#lantern)" opacity=".35"/><ellipse cx="1440" cy="310" rx="250" ry="300" fill="url(#lantern)" opacity=".32"/></g>

    <rect y="1040" width="1920" height="40" fill="#050403" opacity=".62"/>
  </g>
</svg>
