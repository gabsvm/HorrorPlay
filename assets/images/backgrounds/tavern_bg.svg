<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#241912"/><stop offset=".65" stop-color="#17100c"/><stop offset="1" stop-color="#0b0806"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5a341d"/><stop offset=".45" stop-color="#321c11"/><stop offset="1" stop-color="#170d08"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#332116"/><stop offset="1" stop-color="#0c0806"/></linearGradient>
    <radialGradient id="fire"><stop stop-color="#ffd07b" stop-opacity=".9"/><stop offset=".25" stop-color="#d76a25" stop-opacity=".48"/><stop offset="1" stop-color="#27120a" stop-opacity="0"/></radialGradient>
    <radialGradient id="lantern"><stop stop-color="#ffd88b" stop-opacity=".68"/><stop offset=".4" stop-color="#b96b2e" stop-opacity=".17"/><stop offset="1" stop-color="#170d08" stop-opacity="0"/></radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".34" numOctaves="3" seed="18" result="n"/><feColorMatrix in="n" type="matrix" values=".13 0 0 0 0 0 .13 0 0 0 0 0 .13 0 0 0 0 0 .15 0"/><feBlend in2="SourceGraphic" mode="overlay"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>

  <g filter="url(#grain)">
    <rect width="1920" height="1080" fill="url(#wall)"/>
    <rect y="745" width="1920" height="335" fill="url(#floor)"/>
    <path d="M0 745H1920M0 830H1920M0 930H1920M0 1040H1920" stroke="#0c0806" stroke-width="5" opacity=".62"/>
    <path d="M150 745L0 1080M470 745L330 1080M800 745L750 1080M1130 745L1190 1080M1470 745L1630 1080M1740 745L1920 1010" stroke="#120c09" stroke-width="4" opacity=".6"/>

    <!-- beams and warped ceiling -->
    <path d="M0 95H1920M180 0V740M690 0V740M1210 0V740M1710 0V740" stroke="#090604" stroke-width="34" opacity=".92"/>
    <path d="M0 96L330 35L690 96L1010 40L1210 96L1480 44L1920 95" fill="none" stroke="#0b0705" stroke-width="25"/>

    <!-- rainy door / entrance left -->
    <g transform="translate(55 280)">
      <rect width="250" height="480" fill="#100b08" stroke="#070504" stroke-width="14"/>
