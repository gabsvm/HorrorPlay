<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#020608"/><stop offset=".6" stop-color="#081417"/><stop offset="1" stop-color="#0e2022"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#10282b"/><stop offset=".35" stop-color="#07191c"/><stop offset="1" stop-color="#02080a"/></linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b7cbca" stop-opacity=".02"/><stop offset=".35" stop-color="#c4d6d5" stop-opacity=".14"/><stop offset=".7" stop-color="#9fb6b5" stop-opacity=".06"/><stop offset="1" stop-color="#c3d2d0" stop-opacity=".01"/></linearGradient>
    <radialGradient id="beam"><stop stop-color="#e9d28a" stop-opacity=".5"/><stop offset=".35" stop-color="#c8a253" stop-opacity=".13"/><stop offset="1" stop-color="#c8a253" stop-opacity="0"/></radialGradient>
    <radialGradient id="green"><stop stop-color="#79deb4" stop-opacity=".76"/><stop offset=".22" stop-color="#2b8c70" stop-opacity=".32"/><stop offset="1" stop-color="#0b2922" stop-opacity="0"/></radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".4" numOctaves="3" seed="31" result="n"/><feColorMatrix in="n" type="matrix" values=".13 0 0 0 0 0 .13 0 0 0 0 0 .13 0 0 0 0 0 .16 0"/><feBlend in2="SourceGraphic" mode="overlay"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <g filter="url(#grain)">
    <rect width="1920" height="1080" fill="url(#sky)"/>
    <path d="M0 560Q280 525 490 566T930 552T1370 570T1920 548V1080H0Z" fill="url(#sea)"/>
    <path d="M0 610Q220 575 470 615T930 598T1400 620T1920 588M0 700Q270 665 520 712T1000 690T1480 710T1920 682M0 810Q240 775 510 825T1020 800T1510 820T1920 790" fill="none" stroke="#294449" stroke-width="4" opacity=".34"/>

    <!-- distant Devil's Reef -->
    <path d="M1190 570L1275 522L1320 540L1390 486L1440 530L1504 510L1585 565Z" fill="#030708" opacity=".96"/>
    <path d="M1387 485l14-180l16 180" fill="#080b0b"/><path d="M1385 340h38" stroke="#0a0c0c" stroke-width="12"/>
    <circle cx="1405" cy="326" r="7" fill="#6c886e" opacity=".5"/>

    <!-- Patrol boat 317 -->
    <g transform="translate(360 520)">
      <path d="M0 220L90 302H710L820 222L698 206H105Z" fill="#121a1b" stroke="#050809" stroke-width="12"/>
      <path d="M130 190H650L610 95H215Z" fill="#263335" stroke="#080b0c" stroke-width="10"/>
      <path d="M260 95V23H480V95" fill="#182123" stroke="#080b0c" stroke-width="10"/>
      <rect x="284" y="42" width="73" height="43" fill="#395761" stroke="#090d0f" stroke-width="6"/><rect x="382" y="42" width="73" height="43" fill="#395761" stroke="#090d0f" stroke-width="6"/>
      <path d="M480 28V-112M480-106l68 31" stroke="#0b0e0f" stroke-width="8"/>
      <path d="M150 228h120M510 228h135" stroke="#849194" stroke-width="5" opacity=".55"/>
      <text x="636" y="274" fill="#aeb6b4" font-size="48" font-family="serif" font-weight="bold">317</text>
      <path d="M112 178h42v-90h-42z" fill="#151b1b"/><circle cx="133" cy="69" r="17" fill="#dfc46e"/>
      <ellipse cx="133" cy="116" rx="210" ry="260" fill="url(#beam)" opacity=".36" filter="url(#soft)"/>
      <!-- crew silhouettes -->
      <g fill="#090d0e"><circle cx="325" cy="94" r="22"/><path d="M294 185q2-75 31-75q32 0 36 75z"/><circle cx="418" cy="94" r="22"/><path d="M388 185q2-75 31-75q31 0 35 75z"/></g>
    </g>

    <!-- impossible glow beneath boat -->
    <ellipse cx="875" cy="873" rx="420" ry="145" fill="url(#green)" opacity=".18" filter="url(#soft)"/>
    <g fill="#79deb4" opacity=".18"><ellipse cx="690" cy="852" rx="15" ry="8"/><ellipse cx="785" cy="886" rx="18" ry="9"/><ellipse cx="890" cy="850" rx="13" ry="7"/><ellipse cx="1005" cy="900" rx="17" ry="9"/><ellipse cx="1100" cy="860" rx="12" ry="7"/></g>

    <!-- fog banks -->
    <rect y="320" width="1920" height="390" fill="url(#fog)"/>
    <path d="M-80 520Q310 390 660 520T1390 490T2020 510" fill="none" stroke="#a8bdbc" stroke-width="80" opacity=".06" filter="url(#soft)"/>
    <path d="M-90 645Q270 545 610 635T1280 620T2010 600" fill="none" stroke="#b4c7c5" stroke-width="70" opacity=".045" filter="url(#soft)"/>

    <!-- rain -->
    <g stroke="#b7d1d3" stroke-width="3" opacity=".2"><path d="M80 0l-74 222M260 30l-73 218M450 4l-72 215M640 45l-70 210M830 0l-74 224M1040 25l-72 217M1250 5l-74 222M1450 35l-70 209M1660 4l-73 219M1850 22l-70 210"/></g>
    <rect y="1038" width="1920" height="42" fill="#010405" opacity=".66"/>
  </g>
</svg>
