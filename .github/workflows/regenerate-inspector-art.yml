name: Regenerate Inspector Art

on:
  push:
    branches:
      - agent/aa-character-overhaul
    paths:
      - tools/generate_inspector_art.py
      - tools/postprocess_inspector_art.py
      - .github/workflows/regenerate-inspector-art.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout character overhaul branch
        uses: actions/checkout@v4
        with:
          ref: agent/aa-character-overhaul
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Regenerate Inspector frames
        run: python tools/generate_inspector_art.py

      - name: Apply noir raster polish
        run: python tools/postprocess_inspector_art.py

      - name: Commit generated raster assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/characters/inspector_production
          if git diff --cached --quiet; then
            echo "Inspector raster assets already match the generation pipeline."
            exit 0
          fi
          git commit -m "art: regenerate polished inspector raster frames"
          git push origin HEAD:agent/aa-character-overhaul
