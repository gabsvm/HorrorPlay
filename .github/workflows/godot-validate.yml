name: Godot Validate

on:
  push:
    branches:
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Import validate and character integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64
          ./Godot_v4.6.3-stable_linux.x86_64 --version

      - name: Import project resources
        shell: bash
        run: |
          set -euo pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --path . \
            --import

      - name: Validate scripts scenes and assets
        shell: bash
        run: |
          set +e
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --path . \
            --script res://tools/validate_project.gd \
            > /tmp/godot-validator.log 2>&1
          status=$?
          set -e
          cat /tmp/godot-validator.log
          exit "$status"

      - name: Upload validator diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-validator-log
          path: /tmp/godot-validator.log
          if-no-files-found: ignore

      - name: Require Cartoon Detective authored asset integration
        shell: bash
        run: |
          set -euo pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --path . \
            res://tools/test_cartoon_detective_asset_runner.tscn

      - name: Diagnose validator exit leaks
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --verbose \
            --headless \
            --path . \
            --script res://tools/validate_project.gd \
            > /tmp/godot-validator-verbose.log 2>&1
          status=$?
          set -e
          echo "--- Godot verbose tail ---"
          tail -n 160 /tmp/godot-validator-verbose.log
          if grep -Fq "Resource still in use: res://src/common/classes/item_data.gd" /tmp/godot-validator-verbose.log; then
            echo "::error::ItemData script resource leaked at validator shutdown"
            exit 1
          fi
          exit "$status"

      - name: Run character integration acceptance test
        shell: bash
        run: |
          set -euo pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --path . \
            res://tools/test_runner.tscn

      - name: Run interaction cancellation safety regression
        shell: bash
        run: |
          set -euo pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --path . \
            res://tools/test_interaction_safety_runner.tscn

      - name: Run scene transition input ownership regression
        shell: bash
        run: |
          set -euo pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --path . \
            res://tools/test_scene_transition_lock_runner.tscn

      - name: Run save schema safety regression
        shell: bash
        run: |
          set -euo pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --path . \
            res://tools/test_save_system_safety_runner.tscn

      - name: Run HUD input safety regression
        shell: bash
        run: |
          set -euo pipefail
          ./Godot_v4.6.3-stable_linux.x86_64 \
            --headless \
            --path . \
            res://tools/test_hud_input_safety_runner.tscn

      - name: Diagnose scene-test shutdown leaks
        shell: bash
        run: |
          set -euo pipefail
          declare -A suites=(
            [character]="res://tools/test_runner.tscn"
            [interaction]="res://tools/test_interaction_safety_runner.tscn"
            [transition]="res://tools/test_scene_transition_lock_runner.tscn"
            [hud]="res://tools/test_hud_input_safety_runner.tscn"
          )
          for name in character interaction transition hud; do
            log="/tmp/${name}-verbose.log"
            set +e
            ./Godot_v4.6.3-stable_linux.x86_64 \
              --verbose \
              --headless \
              --path . \
              "${suites[$name]}" \
              > "$log" 2>&1
            status=$?
            set -e
            echo "--- ${name} shutdown diagnostics ---"
            if grep -E "Leaked instance|Resource still in use: res://.*\.ogg|ObjectDB instances leaked" "$log"; then
              echo "::error::Shutdown leak detected in ${name}"
              exit 1
            fi
            echo "--- ${name} tail ---"
            tail -n 80 "$log"
            if [ "$status" -ne 0 ]; then
              exit "$status"
            fi
          done
